name: Bump formula

# Updates Formula/deyta.rb to a new deyta-cli release. Triggered automatically by
# the deyta-cli release workflow (repository_dispatch), or manually.

on:
  repository_dispatch:
    types: [bump-formula]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to pin (blank = latest on PyPI)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: v
        run: |
          version="${{ github.event.client_payload.version || github.event.inputs.version }}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Update formula
        run: python3 scripts/update-formula.py ${{ steps.v.outputs.version }}

      - name: Commit
        run: |
          if git diff --quiet; then
            echo "Formula already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "deyta ${{ steps.v.outputs.version || 'latest' }}"
          git push
